# Render blueprint for the RainShield inference API.
#
# The dashboard is deployed separately on Vercel, so only the backend lives
# here. Point Vercel's VITE_API_BASE at this service's URL and redeploy it —
# Vite inlines VITE_* at build time, so an existing bundle will not pick up
# a change without a rebuild.
#
# The commands run from the repository root rather than using rootDir, so that
# the committed weights and rasters under processed_data/ stay on the path.
#
# NOTE: the deployed rainshield-api service was created by hand, not from this
# blueprint, so Render does NOT read this file — it reported branch "sneha" and
# an empty health check path while the lines below said otherwise. That drift is
# what served a four-merge-old API to a current dashboard: "sneha" stopped at
# PR #7, so /api/regions and /api/observation 404'd and the board silently lost
# its region switcher and Live feed tab. Changing this file alone fixes nothing;
# the branch has to be repointed in the Render dashboard as well. Keep the two
# in step, or adopt the service into the blueprint so this file is authoritative.

services:
  - type: web
    name: rainshield-api
    runtime: python
    plan: free
    region: singapore          # closest Render region to the Mumbai study area
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn rainshield.api.app:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RAINSHIELD_PROVIDER
        value: auto             # preferred live source ("openmeteo", "metno");
                                # the rest still follow as fallbacks. "auto"
                                # means no preference. "synthetic" for an
                                # offline demo. Simulated regions ignore this.
      - key: RAINSHIELD_CACHE_TTL
        value: "600"            # seconds an observation is reused
      # The simulated region issues an observation on the same cadence as the
      # live feed by default; RAINSHIELD_SIM_CADENCE overrides it, and
      # RAINSHIELD_SIM_PERIOD (minutes, default 180) sets the storm cycle.
      - key: RAINSHIELD_CORS_ORIGINS
        value: "*"              # public read-only API; no credentials are sent
      - key: PYTHONUNBUFFERED
        value: "1"
